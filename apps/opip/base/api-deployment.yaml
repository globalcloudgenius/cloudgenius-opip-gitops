apiVersion: apps/v1
kind: Deployment
metadata:
  name: opip-api
  labels:
    app.kubernetes.io/name: opip-api
    app.kubernetes.io/part-of: opip
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: opip-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opip-api
        app.kubernetes.io/part-of: opip
    spec:
      serviceAccountName: opip
      imagePullSecrets:
        - name: harbor-pull
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: harbor.cloudgenius.ca/opip/opip-api:main
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 30
