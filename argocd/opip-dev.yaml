apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: opip-dev
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/globalcloudgenius/cloudgenius-opip-gitops.git
    targetRevision: main
    path: apps/opip/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: opip-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
  revisionHistoryLimit: 10
